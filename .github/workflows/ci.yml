name: Mobile App Security Analyzer CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-analyzer-tests:
    name: Python Static Analyzer Verification & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Python Syntax & Compilation Verification
        run: |
          cd analyzer
          python -m py_compile main.py utils/*.py analyzers/*.py

      - name: Generate Test APK Artifact
        run: |
          cd analyzer
          python create_test_apk.py

      - name: Run Python Analyzer Unit Tests
        run: |
          cd analyzer
          python test_analyzer.py

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Frontend Bundle
        run: |
          cd frontend
          npm run build

  backend-verification:
    name: Backend Syntax & E2E Integration Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password_2026!
          MYSQL_DATABASE: mobile_security_analyzer
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password_2026!
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Set up Python 3.12 (For analysis subprocesses)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies for Analysis Engine
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Generate Test APK in Analyzer
        run: |
          cd analyzer
          python create_test_apk.py

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Backend Syntax Verification
        run: |
          cd backend
          find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +

      - name: Initialize Test Database Schema & Seeds
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password_2026! mobile_security_analyzer < database/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password_2026! mobile_security_analyzer < database/seed.sql

      - name: Run Backend Integration & E2E Regression Suite
        env:
          PORT: 5000
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: mobile_security_analyzer
          DB_USER: root
          DB_PASSWORD: ci_root_password_2026!
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long_123456789
          JWT_EXPIRES_IN: 7d
          UPLOAD_DIR: ./uploads
          REPORT_DIR: ./reports
          MAX_FILE_SIZE_MB: 200
          PYTHON_PATH: python
          CLIENT_URL: http://localhost:5173
        run: |
          cd backend
          node server.js &
          sleep 5
          npm run test:e2e
